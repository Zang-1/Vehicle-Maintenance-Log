<!doctype html>
<html lang="vi">
<head>
  {% include "_head.html" %}
  <title>{% block title %}{% endblock %} · Sổ Bảo Dưỡng Xe</title>
</head>
<body class="auth-page">
  {# Sign-in and sign-up: no menu, one glass card in the middle. auth.js sends the form. #}
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  </svg>

  <button class="icon-btn auth-theme" type="button" data-theme-toggle aria-label="Chuyển giao diện sáng/tối" title="Chuyển giao diện sáng/tối">
    <svg class="ic theme-dark"><use href="#i-moon"></use></svg><svg class="ic theme-light"><use href="#i-sun"></use></svg>
  </button>

  <main class="auth-wrap">
    <a class="brand" href="/dang-nhap">
      <span class="brand-mark"><svg class="ic"><use href="#i-wrench"></use></svg></span>
      <span><b>Sổ Bảo Dưỡng</b><small>Vehicle Maintenance Log</small></span>
    </a>
    <div class="card auth-card">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="/static/app.js?v={{ request.app.version }}"></script>
  <script src="/static/auth.js?v={{ request.app.version }}"></script>
</body>
</html>
