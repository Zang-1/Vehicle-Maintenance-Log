{% extends "_auth.html" %}

{% block title %}Đăng ký{% endblock %}

{% block content %}
<div>
  <h1 class="auth-title">Tạo tài khoản</h1>
  <p class="muted">Miễn phí. Chỉ cần email và mật khẩu.</p>
</div>

<form class="auth-form" id="auth-form" data-url="/api/auth/register" data-next="{{ next }}" novalidate>
  <div class="field">
    <label class="field-label" for="f-name">Tên của bạn</label>
    <input class="control" id="f-name" name="display_name" maxlength="60" autocomplete="name" required autofocus placeholder="Ví dụ: Bảo Giang">
  </div>
  <div class="field">
    <label class="field-label" for="f-email">Email</label>
    <input class="control" id="f-email" name="email" type="email" maxlength="254" autocomplete="email" required>
  </div>
  <div class="field">
    <label class="field-label" for="f-password">Mật khẩu</label>
    <input class="control" id="f-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    <span class="field-help">Ít nhất 8 ký tự.</span>
  </div>
  <p class="form-alert" id="auth-error" role="alert" hidden></p>
  <button class="btn btn-primary btn-big" type="submit">Tạo tài khoản</button>
</form>

<p class="auth-switch">Đã có tài khoản? <a href="/dang-nhap{{ '?next=' ~ (next | urlencode) if next != '/' else '' }}">Đăng nhập</a></p>
{% endblock %}
