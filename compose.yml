# Local development stack: the app + PostgreSQL 16, started with one command.
# Render does not read this file; in the cloud the database is Supabase (doc 07, section 3).
services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:8000"  # only this laptop can reach it
    environment:
      # host "db" is the service name below; never "localhost" inside a container
      DATABASE_URL: postgresql://app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/appdb
      APP_ENV: ${APP_ENV:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}  # optional: /diagnose (M7) answers NO_KEY without it
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # run only when the volume is empty (first start, or after "down -v")
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
