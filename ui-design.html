<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Bảo Dưỡng Xe – UI Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Sổ Bảo Dưỡng Xe — Glass UI
   Frosted panels over a soft colour field: morning sky (light), city at night (dark).
   Colour goes on data and actions; panels stay neutral glass.
   ===================================================================== */
:root{
  /* ground: the colour field behind the glass */
  --bg:#E6EEF7; --mesh-1:#7DD3FC; --mesh-2:#86EFAC; --mesh-3:#FDBA74; --mesh-4:#93C5FD;
  /* glass */
  --surface:rgba(255,255,255,.58); --surface-strong:rgba(255,255,255,.88); --surface-2:rgba(15,23,42,.05);
  --glass-border:rgba(255,255,255,.75); --border:rgba(15,23,42,.09); --border-strong:rgba(15,23,42,.18);
  --glass-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px -12px rgba(15,40,70,.18);
  --blur:18px; --nav-active:rgba(255,255,255,.85);
  /* ink */
  --text:#0B1626; --text-muted:#475569;
  /* action and data */
  --primary:#0E7490; --primary-hover:#155E75; --primary-soft:rgba(14,116,144,.12); --on-primary:#FFFFFF;
  --accent:#D97706; --accent-soft:rgba(217,119,6,.14); --on-accent:#FFFFFF;
  --ok:#047857; --ok-bg:rgba(4,120,87,.12); --warn:#B45309; --warn-bg:rgba(217,119,6,.15); --bad:#C2271F; --bad-bg:rgba(220,38,38,.12);
  --overlay:rgba(15,23,42,.35); --shadow:0 18px 40px -16px rgba(15,40,70,.28);
  --sidebar:rgba(255,255,255,.55); --sidebar-text:#334155; --sidebar-active:rgba(255,255,255,.85);
  --radius-card:20px; --radius-control:12px; --radius-pill:999px;
  --font:"Be Vietnam Pro",Inter,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#050A14; --mesh-1:rgba(14,165,233,.30); --mesh-2:rgba(16,185,129,.20); --mesh-3:rgba(245,158,11,.22); --mesh-4:rgba(56,189,248,.14);
  --surface:rgba(17,26,45,.58); --surface-strong:rgba(14,22,40,.92); --surface-2:rgba(255,255,255,.06);
  --glass-border:rgba(255,255,255,.10); --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.18);
  --glass-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 14px 34px -14px rgba(0,0,0,.6);
  --nav-active:rgba(255,255,255,.12);
  --text:#EAF0F8; --text-muted:#9AA8BC;
  --primary:#22D3EE; --primary-hover:#67E8F9; --primary-soft:rgba(34,211,238,.14); --on-primary:#04222B;
  --accent:#FBBF24; --accent-soft:rgba(251,191,36,.14); --on-accent:#1F1300;
  --ok:#34D399; --ok-bg:rgba(52,211,153,.14); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.14); --bad:#F87171; --bad-bg:rgba(248,113,113,.15);
  --overlay:rgba(0,0,0,.55); --shadow:0 18px 44px -16px rgba(0,0,0,.7);
  --sidebar:rgba(17,26,45,.55); --sidebar-text:#C3CEDD; --sidebar-active:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:23px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
/* the colour field the glass blurs: fixed, so panels keep the same tint while scrolling */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 42% at 12% 10%,var(--mesh-1),transparent 70%),radial-gradient(34% 40% at 88% 14%,var(--mesh-3),transparent 70%),
             radial-gradient(40% 44% at 80% 88%,var(--mesh-2),transparent 70%),radial-gradient(36% 40% at 18% 86%,var(--mesh-4),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.ic.s16{width:16px;height:16px}.ic.s18{width:18px;height:18px}.ic.s22{width:22px;height:22px}.ic.s24{width:24px;height:24px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.t-display{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.8px}
.t-h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.5px}
.t-h2{font-size:20px;line-height:28px;font-weight:650;letter-spacing:-.2px}
.t-h3{font-size:16px;line-height:24px;font-weight:600}
.t-body{font-size:15px;line-height:23px}
.t-small{font-size:14px;line-height:21px}
.t-caption{font-size:12.5px;line-height:17px;font-weight:500}
.t-overline{font-size:12px;line-height:16px;font-weight:600}
.t-numl{font-size:30px;line-height:36px;font-weight:750;letter-spacing:-.6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.hide{display:none!important}

/* ---------- glass surfaces ---------- */
.card,.sidebar,.mheader,.bnav,.pop,.ds-sheet,.auth-form .box,.vcard{background:var(--surface);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.card{border-radius:var(--radius-card);padding:22px}
/* glass inside glass blurs twice and turns muddy: inner panels become a plain tint */
.card .card,.modal .card,.ds-sheet .card,.cset .card{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface-2);box-shadow:none;border-color:var(--border)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.sm{height:36px;padding:0 14px;font-size:14px}.btn.sm .ic{width:16px;height:16px}
.btn.big{height:54px;padding:0 26px;font-size:16px}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 20px -10px var(--primary)}.btn.primary:hover{background:var(--primary-hover)}
.btn.secondary{background:var(--surface-strong);border-color:var(--glass-border);color:var(--text)}.btn.secondary:hover{border-color:var(--border-strong)}
.btn.ghost{background:transparent;color:var(--primary)}.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger-ghost{background:var(--surface-strong);border-color:var(--glass-border);color:var(--bad)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.accent{background:var(--accent);color:#1F1300}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--glass-border);background:var(--surface);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);cursor:pointer;position:relative;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--surface-strong)}
.icon-btn.plain{border-color:transparent;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.icon-btn .dot{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;line-height:18px}

/* ---------- badges, links ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.nodot::before{display:none}
.b-ok{color:var(--ok);background:var(--ok-bg)}.b-warn{color:var(--warn);background:var(--warn-bg)}.b-bad{color:var(--bad);background:var(--bad-bg)}
.b-neutral{color:var(--text-muted);background:var(--surface-2)}.b-info{color:var(--primary);background:var(--primary-soft)}.b-accent{color:var(--accent);background:var(--accent-soft)}
.link{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--primary);cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600;line-height:18px}
.req{color:var(--bad)}
.control{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--border-strong);background:var(--surface-strong);color:var(--text-muted);transition:border-color .15s,box-shadow .15s}
.control:focus-within,.control.focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.control.error{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.control input,.control select{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);height:100%;appearance:none}
.control input[type=date]{appearance:auto}
.control select{cursor:pointer}
.control select option{background:var(--bg);color:var(--text)}
.control .suffix{font-size:13px;color:var(--text-muted);white-space:nowrap}
textarea.area{width:100%;min-height:120px;resize:vertical;padding:12px 14px;border-radius:var(--radius-control);border:1px solid var(--border-strong);background:var(--surface-strong);color:var(--text);outline:0;line-height:23px}
textarea.area:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
textarea.area.error{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.help{font-size:12.5px;line-height:17px;color:var(--text-muted)}
.help.err{color:var(--bad);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;padding:4px;gap:2px;border-radius:var(--radius-pill);background:var(--surface-2);border:1px solid var(--border)}
.seg button{border:0;background:transparent;height:38px;padding:0 16px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-muted);font-weight:600;transition:background .15s,color .15s}
.seg button.on{background:var(--surface-strong);color:var(--text);box-shadow:0 2px 8px -2px rgba(15,23,42,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:var(--radius-pill);border:1px solid var(--glass-border);background:var(--surface);color:var(--text-muted);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .count{font-size:11.5px;opacity:.7}
.chip.big{height:42px;font-size:14px}
.chip.big.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.switch{width:46px;height:28px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;border:0;flex:none;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--primary)}.switch.on::after{left:21px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--primary);margin:0}
.toggle{display:inline-flex;padding:3px;gap:2px;border-radius:var(--radius-pill);background:var(--surface);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-border);flex:none}
.toggle button{min-width:36px;height:36px;padding:0 9px;border:0;border-radius:999px;background:transparent;color:var(--text-muted);display:grid;place-items:center;cursor:pointer;font-size:12.5px;font-weight:700}
.toggle button .ic{width:17px;height:17px}
.toggle button.on{background:var(--surface-strong);color:var(--accent);box-shadow:0 2px 8px -2px rgba(15,23,42,.25)}
.toggle.lang button.on{color:var(--primary)}

/* ---------- data bits ---------- */
.stat{display:flex;flex-direction:column;gap:8px;padding:22px}
.stat .top{display:flex;align-items:center;gap:10px}
.chipico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.tone-primary{color:var(--primary);background:var(--primary-soft)}.tone-bad{color:var(--bad);background:var(--bad-bg)}.tone-warn{color:var(--warn);background:var(--warn-bg)}.tone-accent{color:var(--accent);background:var(--accent-soft)}.tone-ok{color:var(--ok);background:var(--ok-bg)}.tone-neutral{color:var(--text-muted);background:var(--surface-2)}
.fg-primary{color:var(--primary)}.fg-bad{color:var(--bad)}.fg-warn{color:var(--warn)}.fg-accent{color:var(--accent)}.fg-ok{color:var(--ok)}.fg-neutral{color:var(--text-muted)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .4s}
.progress.bad>span{background:var(--bad)}.progress.warn>span{background:var(--warn)}.progress.ok>span{background:var(--ok)}.progress.neutral>span{background:var(--border-strong)}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:16px}
.alert>.ic{margin-top:1px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--primary-soft);color:var(--primary)}
.alert b{display:block;font-weight:650}
.alert p{color:var(--text);font-size:14px;line-height:21px}
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:var(--radius-pill);background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);overflow-x:auto;max-width:100%;align-self:flex-start}
.tabs button{border:0;background:transparent;height:40px;padding:0 16px;color:var(--text-muted);font-weight:600;cursor:pointer;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s}
.tabs button.on{background:var(--surface-strong);color:var(--text);box-shadow:0 2px 8px -2px rgba(15,23,42,.2)}
.tabs .cnt{font-size:11.5px;background:var(--surface-2);color:var(--text-muted);border-radius:999px;padding:0 7px;line-height:18px}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--border-strong) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px}
.empty .art{width:96px;height:96px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--text-muted)}
.thumb{border-radius:16px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb svg{display:block}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.kbd{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-muted);white-space:nowrap}
.divider{height:1px;background:var(--border);margin:4px 0}
.plate{white-space:nowrap;display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:7px;border:1.5px solid var(--text);font-size:12.5px;font-weight:700;letter-spacing:.3px;background:var(--surface-strong);color:var(--text)}
.box2{background:var(--surface-2);border-radius:14px;padding:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--text-muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--border)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer;transition:background .12s}.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .strong{font-weight:600;font-size:14.5px}
.tbl .sub{display:block;font-size:12.5px;color:var(--text-muted);font-weight:400}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:16px;margin:16px 0 16px 16px;height:calc(100vh - 32px);border-radius:26px;padding:22px 16px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;padding:0 6px 22px}
.logo .mark{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);flex:none;box-shadow:0 8px 18px -8px var(--accent)}
.logo b{display:block;color:var(--text);font-size:16px;line-height:22px;font-weight:700}
.logo small{display:block;color:var(--text-muted);font-size:12px;line-height:16px}
.nav-label{color:var(--text-muted);margin:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;color:var(--sidebar-text);font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-item .ic{color:var(--text-muted)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--nav-active);color:var(--text);box-shadow:0 4px 14px -6px rgba(15,23,42,.25)}
.nav-item.on .ic{color:var(--primary)}
.nav-item .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:0 8px;line-height:20px}
.sb-user{display:flex;align-items:center;gap:10px;padding:14px 6px 0;margin-top:auto;border-top:1px solid var(--border);color:var(--text-muted)}
.sb-user b{color:var(--text);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .icon-btn{width:40px;height:40px}
.main{padding:30px 40px 56px 32px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:26px;position:relative}
.topbar .search{width:280px;height:46px;border-radius:var(--radius-pill);background:var(--surface);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:var(--glass-border)}
.mheader,.bnav{display:none}
.screen{display:flex;flex-direction:column;gap:24px}
.enter>*{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pop{position:absolute;right:0;top:56px;width:350px;z-index:30;border-radius:20px;padding:8px;background:var(--surface-strong)}
.pop .pi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.pop .pi:hover{background:var(--surface-2)}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow .t{font-weight:600}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:200px;padding-top:8px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;height:100%;justify-content:flex-end}
.bars .bar{width:100%;max-width:28px;border-radius:10px 10px 4px 4px;background:var(--primary);position:relative;transition:height .4s}
.bars .bar.lo{opacity:.5}.bars .bar.zero{background:var(--border-strong);opacity:.6}
.bars .bar:hover::after{content:attr(data-v);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11.5px;padding:3px 7px;border-radius:7px;white-space:nowrap;z-index:2}
.donut{width:184px;height:184px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface-strong)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:1}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:10px;font-size:14px}
.legend .sw{width:11px;height:11px;border-radius:4px;flex:none}

/* ---------- vehicles ---------- */
.vcard{padding:0;overflow:hidden;display:flex;flex-direction:column;border-radius:var(--radius-card);transition:transform .18s,box-shadow .18s;cursor:pointer;text-align:left;font:inherit;color:inherit}
.vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.vcard .pic{height:156px;display:grid;place-items:center;position:relative;background:linear-gradient(180deg,transparent 40%,var(--surface-2))}
.vcard .pic .badge{position:absolute;top:14px;right:14px}
.vcard .pic .type{position:absolute;top:14px;left:14px;right:auto}
.vcard.arch .pic svg{filter:grayscale(1);opacity:.6}
.vcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.vcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard .meta div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.vcard .meta small{display:block;font-size:12px;color:var(--text-muted);line-height:15px}
.vcard .meta b{font-weight:650;font-size:14px}
.vcard.add{border-style:dashed;border-width:1.5px;border-color:var(--border-strong);align-items:center;justify-content:center;gap:12px;color:var(--text-muted);min-height:320px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.vcard.add:hover{background:var(--surface)}
.vcard.add .chipico{width:56px;height:56px;border-radius:18px}
.tl{display:flex;flex-direction:column;gap:16px}
.tl-item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;position:relative}
.tl-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);z-index:1}
.tl-line{position:absolute;left:14px;top:32px;bottom:-18px;width:2px;background:var(--border)}
.tl-item:last-child .tl-line{display:none}
.vd-head{flex-wrap:wrap}.vd-head>.col{min-width:260px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border)}
.kpis>div{padding:16px 24px;border-right:1px solid var(--border)}
.kpis>div:last-child{border-right:0}

/* ---------- maintenance form ---------- */
.items{display:flex;flex-direction:column;gap:10px}
.item-head,.item-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.3fr) 76px 140px 120px 44px;gap:10px;align-items:start}
.item-head span{font-size:12.5px;font-weight:600;color:var(--text-muted)}
.item-row .control{height:46px}
.item-row .lt{height:46px;display:flex;align-items:center;justify-content:flex-end;font-weight:650}
.items.simple .f-desc,.items.simple .f-qty,.items.simple .lt{display:none}
.items.simple .item-row{grid-template-columns:minmax(0,1fr) 190px 44px;padding:0;border:0}
.items.simple .item-row .f-type{grid-column:auto;padding-right:0}
.items.simple .item-row .del{position:static}
.rec-top{grid-template-columns:repeat(2,minmax(0,1fr))}.rec-top>.field:first-child{grid-column:1/-1}
.sum{display:flex;flex-direction:column;gap:10px}
.sum .li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.receipt{flex:1 1 520px;min-width:0;max-width:760px}
.receipt .card{border-radius:var(--radius-card)}
.receipt .zig{display:none}
.urg{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px}
.meter{display:flex;gap:4px}
.meter i{width:28px;height:8px;border-radius:4px;background:color-mix(in srgb,currentColor 25%,transparent)}
.meter i.on{background:currentColor}

/* ---------- home ---------- */
.dash-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dash-status{display:inline-flex;align-items:center;gap:8px;font-weight:650;padding:9px 16px;border-radius:999px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dash-status.bad{background:var(--bad-bg);color:var(--bad)}.dash-status.ok{background:var(--ok-bg);color:var(--ok)}
.next-card{display:flex;align-items:center;gap:22px;padding:22px 26px}
.next-card .thumb{width:128px;height:84px;background:var(--surface-2)}
.next-card .t-h2{font-size:24px;line-height:30px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tile,.dveh,.menu-row{font:inherit;color:inherit;text-align:left;cursor:pointer}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:transform .18s,box-shadow .18s}
.tile .t-numl{font-size:34px;line-height:42px;margin-top:2px}
.tile-more{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;font-weight:600;color:var(--primary);margin-top:4px}
.tile:hover,.dveh:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tile:active,.dveh:active,.vcard:active{transform:scale(.99)}
.section-h{display:flex;align-items:center;gap:8px;margin-bottom:-8px}
.dveh-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.dveh{display:flex;gap:16px;align-items:center;transition:transform .18s,box-shadow .18s;padding:16px 18px}
.dveh .thumb{width:118px;height:76px;background:var(--surface-2)}
/* service gauge: how much of the interval is used, like the needle on a car dashboard */
.gauge{position:relative;width:64px;height:64px;flex:none}
.gauge svg{display:block;transform:rotate(-90deg)}
.gauge .track{stroke:var(--surface-2);stroke-width:7;fill:none}
.gauge .val{stroke-width:7;fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}
.disc{border:1px solid var(--glass-border);border-radius:18px;background:var(--surface);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.card .disc{background:var(--surface-2);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--border)}
.disc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:600;color:var(--primary);border-radius:18px}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary .ic{transition:transform .2s}
.disc[open]>summary .ic{transform:rotate(180deg)}
.disc-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px}
.menu-row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;border:0;background:none;border-radius:14px;transition:background .15s}
.menu-row:hover{background:var(--surface-2)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.stepnum{width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;flex:none}

/* ---------- modal, toast ---------- */
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal-bg.on{display:flex;animation:fade .15s}
.modal{width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-strong);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);border-radius:26px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;border:1px solid var(--glass-border);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.modal .mic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--surface-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-border);color:var(--text);padding:12px 18px;border-radius:999px;display:flex;align-items:center;gap:10px;z-index:60;transition:all .22s;box-shadow:var(--shadow);font-weight:600;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ic{color:var(--ok)}
.toast.bad .ic{color:var(--bad)}

/* ---------- sign in ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;padding:16px;gap:16px}
.auth-art{position:relative;overflow:hidden;border-radius:30px;background:rgba(6,18,36,.78);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:#fff;padding:40px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;border:1px solid rgba(255,255,255,.08)}
.auth-art .glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.35),transparent 65%);right:-180px;top:-140px}
.auth-art .road{position:absolute;left:-10%;right:-10%;bottom:-80px;height:260px;background:radial-gradient(60% 60% at 50% 100%,rgba(34,211,238,.28),transparent 70%)}
.auth-art>*{position:relative;z-index:1}
.auth-art .logo b{color:#fff}
.auth-art .feat{display:flex;align-items:flex-start;gap:12px}
.auth-art .feat .chipico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff}
.auth-art .scene{display:flex;align-items:flex-end;margin:12px 0}
.auth-art .scene>span+span{margin-left:-40px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:24px}
.auth-form .box{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px;padding:32px;border-radius:28px}
.or{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.strength{display:flex;gap:6px}.strength i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.strength.s1 i:nth-child(-n+1){background:var(--bad)}.strength.s2 i:nth-child(-n+2){background:var(--warn)}.strength.s3 i:nth-child(-n+3){background:var(--ok)}.strength.s4 i{background:var(--ok)}

/* ---------- design system sheet ---------- */
.ds{max-width:1260px;margin:0 auto;padding:28px 28px 110px}
.ds-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ds-sheet{border-radius:30px;padding:48px 56px;display:flex;flex-direction:column;gap:46px}
.ds-sec{display:flex;flex-direction:column;gap:18px}
.ds-sec>.t-overline{color:var(--text-muted);font-size:13px}
.ds-grp{font-weight:650;font-size:14px}
.sw-grid{display:flex;flex-wrap:wrap;gap:16px 12px}
.sw{width:122px}
.sw .c{height:60px;border-radius:14px;border:1px solid var(--border);background-clip:padding-box}
.sw b{display:block;font-size:12.5px;font-weight:600;margin-top:8px;line-height:16px}
.sw code{font-size:11px;color:var(--text-muted);font-family:inherit}
.sw small{display:block;font-size:11.5px;color:var(--text-muted);line-height:15px;margin-top:2px}
.type-row{display:grid;grid-template-columns:140px minmax(0,1fr) 190px;align-items:baseline;gap:24px;padding:12px 0;border-bottom:1px solid var(--border)}
.type-row:last-child{border-bottom:0}
.type-row .lab,.type-row .spec{font-size:12.5px;color:var(--text-muted)}
.type-row .spec{text-align:right}
.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.ico-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;font-size:11.5px;color:var(--text-muted);text-align:center}
.ico-cell:hover{background:var(--surface-2);color:var(--text)}
.ico-cell .ic{color:var(--text);width:22px;height:22px}
.cset{border:1.5px dashed color-mix(in srgb,var(--primary) 45%,transparent);border-radius:18px;padding:20px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cset.dark{background:var(--surface-2)}
.cname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cname b{font-size:14px;font-weight:650}
.cname span{font-size:12.5px;color:var(--text-muted)}
.anno{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.anno>small{font-size:12px;color:var(--primary);font-weight:600}
.sp-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.sp-row .sp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted)}
.sp-row .sp i{display:block;background:var(--primary-soft);border:1px solid var(--primary);border-radius:3px}
.rd-row{display:flex;gap:20px;flex-wrap:wrap}
.rd-row .rd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);text-align:center;max-width:110px}
.rd-row .rd i{width:72px;height:56px;background:var(--primary-soft);border:1.5px solid var(--primary)}
.wire{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.wire .desk{width:520px;max-width:100%;height:300px;border:1px solid var(--border-strong);border-radius:16px;display:grid;grid-template-columns:100px 1fr;gap:8px;padding:8px;overflow:hidden;font-size:11px;background:var(--surface-2)}
.wire .desk .s{background:var(--surface-strong);border-radius:12px;color:var(--text-muted);padding:10px;display:flex;flex-direction:column;gap:6px}
.wire .desk .s i{display:block;height:10px;border-radius:5px;background:var(--surface-2)}
.wire .desk .s i.on{background:var(--primary)}
.wire .desk .c{padding:6px;display:flex;flex-direction:column;gap:8px}
.wire .blk{border:1px dashed var(--primary);border-radius:10px;display:grid;place-items:center;color:var(--primary);background:var(--primary-soft);text-align:center;padding:2px}
.wire .mob{width:170px;height:300px;border:1px solid var(--border-strong);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;font-size:11px;background:var(--surface-2)}
.ds-note{font-size:13px;color:var(--text-muted);max-width:780px}

/* ---------- prototype viewer ---------- */
.viewer{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(10,18,32,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.1)}
.viewer button{border:0;background:transparent;color:#EAF0F8;height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.viewer button:hover{background:rgba(255,255,255,.12)}
.phone-bg{position:fixed;inset:0;background:var(--overlay);z-index:70;display:none;align-items:center;justify-content:center;gap:28px;padding:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.phone-bg.on{display:flex}
.phone{width:414px;height:min(880px,calc(100vh - 40px));border-radius:50px;background:#05070D;padding:46px 12px 12px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;flex:none}
.phone iframe{width:390px;height:100%;border:0;border-radius:8px 8px 40px 40px;background:var(--bg);display:block}
.phone .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:100px;height:22px;border-radius:20px;background:#1F2433}
.phone-side{display:flex;flex-direction:column;gap:10px;color:#fff;max-width:240px}
.phone-side .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
body.embed .viewer{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .topbar .search{width:200px}.topbar .kbd{display:none}
  .topbar .t-h1{font-size:23px;line-height:30px}
  .item-head{display:none}
  .item-row{grid-template-columns:1fr 1fr 1fr;padding:12px;border:1px solid var(--border);border-radius:16px;position:relative}
  .item-row .f-type{grid-column:span 2;padding-right:44px}
  .item-row .f-desc{grid-column:span 3}
  .item-row .del{position:absolute;top:12px;right:12px}
  .item-row .lt{justify-content:flex-start}
}
@media (max-width:767px){
  body{font-size:15px}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar,.topbar{display:none}
  .mheader{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;padding:10px 14px;border-radius:0 0 22px 22px;border-top:0}
  .mheader .mark{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
  .mheader .icon-btn{width:38px;height:38px}
  .mheader .toggle button{min-width:30px;height:30px;padding:0 6px}
  .mheader .t-h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav{display:flex;justify-content:space-around;position:fixed;left:12px;right:12px;bottom:12px;z-index:20;border-radius:26px;padding:6px 6px}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-size:11px;font-weight:600;line-height:15px;padding:6px 0 4px;border:0;background:none;cursor:pointer;white-space:nowrap;border-radius:18px}
  .bnav button span{display:grid;place-items:center;padding:2px 0}
  .bnav button.on{color:var(--primary);background:var(--primary-soft)}
  .main{padding:16px 14px 110px}
  .screen{gap:16px}
  .t-display{font-size:24px;line-height:31px}
  .card{padding:16px;border-radius:18px}
  .grid-4,.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid-3{grid-template-columns:minmax(0,1fr);gap:14px}
  .grid-2.form{grid-template-columns:minmax(0,1fr)}
  .stat{padding:14px;gap:8px}.stat .t-numl{font-size:21px;line-height:28px}
  .stat .top{flex-direction:column;align-items:flex-start;gap:8px}
  .chipico{width:36px;height:36px}
  .row:has(>.t-numl){flex-wrap:wrap}
  .next-card{flex-direction:column;align-items:stretch;gap:12px;padding:18px}
  .next-card .thumb{display:none}
  .next-card .t-h2{font-size:20px;line-height:27px}
  .btn.big{width:100%}
  .tiles{grid-template-columns:1fr 1fr;gap:12px}
  .tiles .tile:last-child{grid-column:1/-1}
  .tile .t-numl{font-size:24px;line-height:30px}
  .dveh-list{grid-template-columns:1fr;gap:12px}
  .dveh{padding:12px;gap:12px}
  .dveh .thumb{width:64px;height:44px}
  .dveh .badge{display:none} /* the gauge already says it */
  .gauge{width:54px;height:54px}.gauge svg{width:54px;height:54px}.gauge b{font-size:12px}
  .dash-bar .btn{width:100%}
  .task .btn{display:inline-flex!important}
  .hide-m{display:none!important}
  .lrow .btn{display:none}
  .bar .grow{flex-basis:100%}
  .bar .control{flex:1}
  .kpis{grid-template-columns:1fr 1fr}.kpis>div{border-bottom:1px solid var(--border)}.kpis>div:nth-child(2n){border-right:0}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border-bottom:1px solid var(--border);padding:10px 0}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl td::before{content:attr(data-l);font-size:12.5px;color:var(--text-muted);text-align:left;flex:none}
  .tbl td.first{display:block;text-align:left;font-weight:650;font-size:14.5px}.tbl td.first::before{display:none}
  .item-row{grid-template-columns:1fr 1fr}
  .item-row .f-type,.item-row .f-desc{grid-column:1/-1}
  .items.simple .item-row{grid-template-columns:minmax(0,1fr) 120px 40px}
  .items.simple .item-row .f-type{grid-column:auto}
  .donut{width:150px;height:150px}
  .auth{grid-template-columns:1fr;padding:12px;gap:12px}
  .auth-art{padding:22px 20px;border-radius:24px}
  .auth-art .feats,.auth-art .foot{display:none}
  .auth-art .t-display{font-size:26px!important;line-height:34px!important}
  .auth-art .scene svg{width:150px;height:auto}.auth-art .scene>span+span svg{width:100px}
  .auth-form{padding:0 0 40px;align-items:flex-start}
  .auth-form .box{padding:22px;border-radius:24px}

// Cộng tháng giống Postgres make_interval: 31/01 + 1 tháng = 28/02, không tràn sang tháng 3.
function addMonths(iso,m){ const d=toDate(iso); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return isoOf(d); }
const diffDays=(a,b)=>Math.round((toDate(a)-toDate(b))/864e5);

// BR-07, BR-08: tính mốc đến hạn và trạng thái giống view v_reminder_status
function remCalc(rm){
  const v=veh(rm.vehicleId), type=stype(rm.typeId);
  const last=recsOf(rm.vehicleId).find(r=>r.items.some(i=>i.typeId===rm.typeId));
  let baseDate=rm.startDate, baseOdo=rm.startOdo;
  if(last && last.date>=rm.startDate){ baseDate=last.date; baseOdo=last.odo; }
  const nextDate=rm.months?addMonths(baseDate,rm.months):null, nextKm=rm.km?baseOdo+rm.km:null;
  const days=nextDate!=null?diffDays(nextDate,TODAY_ISO):null, kmLeft=nextKm!=null?nextKm-v.odo:null;
  let st='OK';
  if(!rm.active||v.archived) st='INACTIVE';
  else if((days!=null&&days<0)||(kmLeft!=null&&kmLeft<0)) st='OVERDUE';
  else if((days!=null&&days<=rm.notifyDays)||(kmLeft!=null&&kmLeft<=rm.notifyKm)) st='DUE_SOON';
  const pTime=nextDate?clamp(diffDays(TODAY_ISO,baseDate)/Math.max(1,diffDays(nextDate,baseDate))):null;
  const pKm=nextKm?clamp((v.odo-baseOdo)/rm.km):null;
  return {...rm,v,type,baseDate,baseOdo,nextDate,nextKm,days,kmLeft,st,pTime,pKm};
}

function remDetail(r){
  // Overdue: say only what is overdue. "Quá 66 ngày · còn 4.900 km" confuses people.
  const over=r.st==='OVERDUE';
  const parts=[];
  if(r.days!=null&&!(over&&r.days>=0)) parts.push(r.days<0?t('overdue_days',{n:-r.days}):r.days===0?t('due_today'):t('days_left',{n:r.days}));

  return parts.join(' · ');
}

function ruleText(km_,mo){ const a=[]; if(km_) a.push(t('every_km',{km:km(km_)})); if(mo) a.push(t('every_mo',{n:mo})); return a.join(' '+t('or')+' ')||'—'; }

function dashVehicle(v){

// How much of the nearest service interval is used, drawn like the needle on a car's dashboard.
function gauge(r){
  if(!r) return '';
  const p=r.st==='OVERDUE'?1:Math.max(r.pTime??0,r.pKm??0), C=2*Math.PI*27, tone=ST_TONE[r.st];
  const label=r.st==='OVERDUE'?'!':Math.round(p*100)+'%';
  return `<div class="gauge" role="img" aria-label="${t('gauge_aria',{p:Math.round(p*100)})}"><svg width="64" height="64" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="val" cx="32" cy="32" r="27" stroke="var(--${tone==='neutral'?'border-strong':tone})" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"/></svg><b class="fg-${tone}">${label}</b></div>`;
}

function aiPanel(){
  const a=UI.ai;
  if(a.state==='loading') return `<div class="row"><span class="badge b-accent nodot">${ic('sparkles','16')}${t('ai_loading')}</span></div><div class="skel" style="height:70px;border-radius:12px"></div><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:12px;width:90%"></div><div class="skel" style="height:64px;border-radius:12px"></div><span class="t-caption muted">${t('ai_loading_sub')}</span>`;
  const d=a.result;
  if(!d) return `<div class="empty"><div class="art" style="color:var(--accent)">${ic('sparkles','24')}</div><b>${t('ai_idle')}</b><span class="t-small muted">${t('ai_idle_sub')}</span></div>`;
  if(d.status==='FAILED'){ const tone=d.error==='RATE_LIMITED'||d.error==='TIMEOUT'?'warn':'bad', icn=tone==='warn'?'clock':'alert';
    return `<div class="row"><span class="badge b-${tone}">${t('ai_no_result')}</span></div><div class="alert ${tone}">${ic(icn,'18')}<div><b>${t('err_'+d.error)}</b><p>${t('errd_'+d.error)}</p></div></div>
      <div class="empty" style="padding:20px"><div class="art" style="color:var(--${tone})">${ic(icn,'24')}</div><span class="t-small muted">${t('ai_kept')}</span>${d.error!=='NO_KEY'?`<button class="btn secondary sm" data-act="ai-run">${ic('refresh')}${t('ai_retry')}</button>`:''}</div>`; }
  const tone={LOW:'ok',MEDIUM:'warn',HIGH:'bad'}[d.urgency], lvl={LOW:1,MEDIUM:2,HIGH:3}[d.urgency], st=stype(d.typeId);
  return `<div class="row"><span class="badge b-accent nodot">${ic('sparkles','16')}${t('ai_result')}</span><span class="grow"></span><span class="t-caption muted">${esc(d.model)} · ${ftime(d.at)}</span></div>

    <div class="col" style="gap:6px"><span class="t-overline muted">${t('ai_suggestion')}</span><p>${esc(d.suggestion[ui.lang])}</p></div>
    <div class="row wrap" style="padding:14px;border-radius:12px;border:1px solid var(--border)"><div class="chipico tone-primary">${ic('wrench')}</div><div class="grow"><div class="t-caption muted">${t('ai_service')}</div><b>${esc(stName(st))}</b></div>
      ${d.vehicleId?`<button class="btn primary sm" data-act="ai-make-rem">${ic('bell')}${t('ai_make_rem')}</button>`:`<span class="t-caption muted">${t('ai_need_vehicle')}</span>`}</div>
    <div class="alert info">${ic('info','18')}<div><b>${t('ai_disclaimer')}</b><p>${t('ai_disclaimer_b')}</p></div></div>
    <div class="row wrap"><button class="link grow" data-go="ai-history">${ic('history','16')} ${t('ai_see_history')}</button><button class="btn secondary sm" data-act="ai-run">${ic('refresh')}${t('ai_again')}</button></div>`;
}
// Giả lập AI bằng từ khoá (bản thật gọi Gemini từ server).
function mockAi(text){
  const s=text.toLowerCase();
  const R=[
   [/phanh|brake/, 'MEDIUM',6,'Má phanh có thể đã mòn hoặc bám bẩn. Nên kiểm tra độ dày má phanh và dầu phanh trong tuần này.','Brake pads may be worn or dirty. Check pad thickness and brake fluid this week.'],
   [/khói|khét|cháy|smoke|burn/, 'HIGH',12,'Mùi khét hoặc khói có thể do rò dầu lên ống xả hoặc chập điện. Dừng xe và kiểm tra ngay, không nên chạy tiếp.','A burning smell or smoke may come from an oil leak on the exhaust or an electrical short. Stop and get it checked now.'],
   [/nổ máy|khó nổ|đề|start/, 'LOW',5,'Bugi yếu hoặc ắc quy sụt áp thường gây khó nổ buổi sáng. Kiểm tra bugi và điện áp ắc quy khi tiện.','A weak spark plug or low battery voltage often causes hard morning starts. Check both when convenient.'],
   [/rung|vibrat/, 'MEDIUM',7,'Rung ở tốc độ cao thường do lốp mòn không đều hoặc mất cân bằng. Nên cân bằng động và kiểm tra lốp.','Vibration at speed is usually uneven tyre wear or imbalance. Get the wheels balanced and tyres checked.'],
   [/đèn|check engine|light/, 'MEDIUM',10,'Đèn kiểm tra động cơ có thể do nắp xăng chưa kín hoặc cảm biến lỗi. Đọc mã lỗi tại gara trong vài ngày tới.','The check-engine light may be a loose fuel cap or a faulty sensor. Have the code read at a garage soon.'],
  ];
  const m=R.find(x=>x[0].test(s))||[null,'LOW',12,'Chưa đủ thông tin để kết luận. Hãy mô tả thêm thời điểm, âm thanh hoặc đèn báo; nếu triệu chứng kéo dài nên mang xe tới gara.','Not enough detail to conclude. Describe when it happens, sounds or warning lights; if it persists, visit a garage.'];
  return {urgency:m[1],typeId:m[2],suggestion:{vi:m[3],en:m[4]}};
}

function pwScore(p){ p=p||''; if(p.length<6) return 0; let s=1; if(p.length>=10) s++; if(/\d/.test(p)&&/[a-zA-Z]/.test(p)) s++; if(/[^a-zA-Z0-9]/.test(p)) s++; return Math.min(4,s); }

/* ============================ DRAFTS (khởi tạo form khi vào route) ============================ */
function initDraft(r){
  const q=r.q; UI.draft={}; UI.errors={};
  if(r.name==='vehicle-new') UI.draft={type:'MOTORBIKE',name:'',plate:'',brand:'',model:'',year:'',odo:'0',purchase:'',color:'#F97316',note:''};
  if(r.name==='vehicle-edit'){ const v=veh(r.id); if(v) UI.draft={...v,year:v.year??'',odo:String(v.odo),plate:v.plate||'',purchase:v.purchase||''}; }
  if(r.name==='vehicle-edit') UI.open.veh=true;
  if(r.name==='record-edit') UI.open.rec=true;
  if(r.name==='record-new'){ const v=veh(q.get('vehicle'))||S.vehicles.find(x=>!x.archived); const type=+q.get('type')||''; const st=stype(type);
    UI.draft={vehicleId:v?v.id:'',date:TODAY_ISO,odo:v?String(v.odo):'',garage:v?(recsOf(v.id)[0]||{}).garage||'':'',note:'',items:[{typeId:type,desc:'',qty:'1',price:''}]}; if(st) UI.draft.items[0].desc=''; }
  if(r.name==='record-edit'){ const x=S.records.find(z=>z.id===r.id); if(x) UI.draft={...x,odo:String(x.odo),items:x.items.map(i=>({...i,qty:String(i.qty),price:String(i.price)}))}; }
  if(r.name==='reminder-new'){ const v=veh(r.id); if(v){ const used=S.reminders.filter(x=>x.vehicleId===v.id).map(x=>x.typeId); const types=typesForVehicle(v); const st=stype(+q.get('type'))||types.find(s=>!used.includes(s.id)&&(s.km||s.months))||types[0];
    UI.draft={vehicleId:v.id,typeId:st?st.id:'',mode:st&&st.km&&st.months?'both':st&&st.km?'km':'mo',km:st&&st.km?String(st.km):'',months:st&&st.months?String(st.months):'',startDate:TODAY_ISO,startOdo:String(v.odo),notifyDays:'7',notifyKm:'300',active:true}; } }
  if(r.name==='reminder-edit'){ const x=S.reminders.find(z=>z.id===r.id); if(x) UI.draft={...x,mode:x.km&&x.months?'both':x.km?'km':'mo',km:x.km?String(x.km):'',months:x.months?String(x.months):'',startOdo:String(x.startOdo),notifyDays:String(x.notifyDays),notifyKm:String(x.notifyKm)}; }
  if(r.name==='login') UI.draft={email:'',password:'',remember:true};
  if(r.name==='register') UI.draft={name:'',email:'',password:'',confirm:'',agree:false};
  if(r.name==='vehicle') UI.tab=q.get('tab')||'his';
}

/* ============================ SUBMIT / VALIDATION ============================ */
function submitVehicle(){
  const d=D(), e={}, editing=UI.r.name==='vehicle-edit', orig=editing?veh(UI.r.id):null;
  const name=d.name.trim(), plate=d.plate.trim();
  if(!name) e.name=t('e_required'); else if(name.length>100) e.name=t('e_too_long',{n:100});
  const dup=plate&&S.vehicles.find(v=>v.id!==(orig&&orig.id)&&(v.plate||'').toLowerCase()===plate.toLowerCase());
  if(dup) e.plate=t('e_plate_dup',{veh:esc(dup.name)});
  if(!isInt(d.odo)) e.odo=t('e_odo'); else if(orig&&N(d.odo)<orig.odo) e.odo=t('e_odo_down',{km:km(orig.odo)});
  if(String(d.year).trim()&&(!isInt(d.year)||+d.year<1950||+d.year>TODAY.getFullYear()+1)) e.year=t('e_year',{y:TODAY.getFullYear()+1});
  if(e.plate||e.year) UI.open.veh=true; // the field with the error must be visible
  if(Object.keys(e).length){ UI.errors=e; render(); return; }
  const data={name,type:d.type,brand:d.brand.trim(),model:d.model.trim(),year:String(d.year).trim()?N(d.year):null,plate,odo:N(d.odo),purchase:d.purchase||'',color:d.color,note:d.note.trim()};
  if(orig){ Object.assign(orig,data); toast(t('t_vehicle_saved')); go(`vehicle/${orig.id}`); }
  else { const v={id:nextId(S.vehicles),archived:false,...data}; S.vehicles.push(v); toast(t('t_vehicle_added',{name:esc(v.name)})); go(`vehicle/${v.id}`); }
}
function submitRecord(){
  const d=D(), e={}, editing=UI.r.name==='record-edit';
  if(!d.date) e.date=t('e_required'); else if(d.date>TODAY_ISO) e.date=t('e_future');
  if(!isInt(d.odo)) e.odo=t('e_odo');
  const valid=d.items.filter(i=>i.typeId);
  if(!valid.length) e.items=t('e_items');
  d.items.forEach((i,k)=>{ if(i.typeId||i.desc||N(i.price)){ if(!i.typeId) e['it'+k+'type']=1; if(!isInt(i.qty,1)) e['it'+k+'qty']=1; if(!isInt(i.price)) e['it'+k+'price']=1; } });
  if(Object.keys(e).some(k=>/^it\d+qty$/.test(k))) UI.open.rec=true; // qty is only shown in the details view
  const kinds=new Set(Object.keys(e).filter(k=>/^it\d+/.test(k)).map(k=>k.replace(/^it\d+/,'')));
  if(kinds.size) e.items=e.items||[...kinds].map(k=>({type:t('rf_choose_type'),qty:t('e_qty'),price:t('e_price_each')})[k]).join(' · ');
  if(!e.date&&!e.odo&&S.records.find(r=>r.id!==(editing?UI.r.id:0)&&r.vehicleId===+d.vehicleId&&r.date===d.date&&r.odo===N(d.odo))) e.dup=t('e_dup_record');
  if(Object.keys(e).length){ UI.errors=e; render(); return; }
  const items=d.items.filter(i=>i.typeId).map(i=>({typeId:+i.typeId,desc:i.desc.trim(),qty:N(i.qty),price:N(i.price)}));
  const data={vehicleId:+d.vehicleId,date:d.date,odo:N(d.odo),garage:d.garage.trim(),note:d.note.trim(),items};
  let id; if(editing){ Object.assign(S.records.find(r=>r.id===UI.r.id),data); id=UI.r.id; } else { id=nextId(S.records); S.records.push({id,...data}); }
  const v=veh(data.vehicleId); let msg=t('t_record_saved');
  if(data.odo>v.odo){ v.odo=data.odo; msg+=' · '+t('t_odo_up',{km:km(v.odo)}); } // BR-02
  toast(msg); go(`record/${id}`);
}
function submitReminder(){
  const d=D(), e={}, editing=UI.r.name==='reminder-edit';
  const kmV=d.mode!=='mo'?d.km:'', moV=d.mode!=='km'?d.months:'';
  if(!d.typeId) e.typeId=t('e_required');
  if(String(kmV).trim()&&!isInt(kmV,1)) e.km=t('e_positive');
  if(String(moV).trim()&&!isInt(moV,1)) e.months=t('e_positive');
  if(!String(kmV).trim()&&!String(moV).trim()) e.interval=t('e_interval');
  if(!isInt(d.startOdo)) e.startOdo=t('e_nonneg');
  if(!isInt(d.notifyDays)) e.notifyDays=t('e_nonneg');
  if(!isInt(d.notifyKm)) e.notifyKm=t('e_nonneg');
  if(e.startOdo||e.notifyDays||e.notifyKm) UI.open.rem=true;
  if(d.typeId&&S.reminders.find(x=>x.id!==(editing?UI.r.id:0)&&x.vehicleId===+d.vehicleId&&x.typeId===+d.typeId)) e.typeId=t('e_rem_dup');
  if(Object.keys(e).length){ UI.errors=e; render(); return; }
  const data={vehicleId:+d.vehicleId,typeId:+d.typeId,km:String(kmV).trim()?N(kmV):null,months:String(moV).trim()?N(moV):null,startDate:d.startDate||TODAY_ISO,startOdo:N(d.startOdo),notifyDays:N(d.notifyDays),notifyKm:N(d.notifyKm),active:!!d.active};
  if(editing) Object.assign(S.reminders.find(x=>x.id===UI.r.id),data); else S.reminders.push({id:nextId(S.reminders),...data});
  toast(t('t_rem_saved')); go(`vehicle/${data.vehicleId}?tab=rem`);
}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function submitLogin(){
  const d=D(), e={};
  if(!EMAIL_RE.test(d.email.trim())) e.email=t('e_email');
  if((d.password||'').length<6) e.password=t('e_pw_len');
  if(Object.keys(e).length){ UI.errors=e; render(); return; }
  UI.loggedIn=true; if(d.email.trim()!==UI.user.email) UI.user={name:d.email.split('@')[0],email:d.email.trim()};
  toast(t('t_welcome',{name:esc(UI.user.name)})); go('dashboard');
}
function submitRegister(){
  const d=D(), e={};
  if(!d.name.trim()) e.name=t('e_required');
  if(!EMAIL_RE.test(d.email.trim())) e.email=t('e_email');
  if((d.password||'').length<6) e.password=t('e_pw_len');
  if(d.confirm!==d.password) e.confirm=t('e_pw_match');
  if(!d.agree) e.agree=t('e_agree');
  if(Object.keys(e).length){ UI.errors=e; render(); return; }
  UI.loggedIn=true; UI.user={name:d.name.trim(),email:d.email.trim()};
  toast(t('t_welcome',{name:esc(UI.user.name)})); go('dashboard');
}

/* ============================ MODALS ============================ */
function openModal(html){ $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`; $('#modal').classList.add('on'); const f=$('#modal').querySelector('input,select,textarea,button'); if(f) f.focus(); }
function closeModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML=''; }
function confirmModal({tone,icon,title,body,ok,okClass='danger',act,id}){
  openModal(`<div class="mic tone-${tone}">${ic(icon,'22')}</div><div class="col"><b class="t-h2">${title}</b><p class="muted">${body}</p></div><div class="acts"><button class="btn secondary" data-act="close-modal">${t('cancel')}</button><button class="btn ${okClass}" data-act="${act}" data-id="${id}">${ic(icon)}${ok}</button></div>`);
}
function svcModal(id){
  const s=id?stype(id):null;
  UI.svc={name:s?stName(s):'',applies:s?s.applies:'ALL',km:s&&s.km?String(s.km):'',months:s&&s.months?String(s.months):'',desc:s?stDesc(s):'',id:s?s.id:null,err:{}};
  renderSvcModal();
}
function renderSvcModal(){
  const m=UI.svc, e=m.err;
  openModal(`<form data-form="svc" class="col" style="gap:16px" novalidate><div class="row"><b class="t-h2 grow">${m.id?t('sv_edit'):t('sv_add')}</b><button type="button" class="icon-btn plain" data-act="close-modal" aria-label="${t('close')}">${ic('x')}</button></div>
    <div class="field"><label>${t('sv_name')} <span class="req">*</span></label><div class="control${e.name?' error':''}"><input data-svc="name" value="${esc(m.name)}" aria-label="${t('sv_name')}"></div>${e.name?`<span class="help err">${e.name}</span>`:''}</div>
    <div class="field"><span class="lbl">${t('sv_applies')}</span><div class="seg">${['MOTORBIKE','CAR','ALL'].map(k=>`<button type="button" class="${m.applies===k?'on':''}" data-act="svc-applies" data-v="${k}">${k==='ALL'?t('ap_ALL'):t('vt_'+k)}</button>`).join('')}</div></div>
    <div class="grid-2"><div class="field"><label>${t('sv_km')}</label><div class="control${e.km?' error':''}"><input data-svc="km" value="${esc(m.km)}" inputmode="numeric" aria-label="${t('sv_km')}"><span class="suffix">km</span></div>${e.km?`<span class="help err">${e.km}</span>`:''}</div>
      <div class="field"><label>${t('sv_mo')}</label><div class="control${e.months?' error':''}"><input data-svc="months" value="${esc(m.months)}" inputmode="numeric" aria-label="${t('sv_mo')}"><span class="suffix">${t('months')}</span></div>${e.months?`<span class="help err">${e.months}</span>`:''}</div></div>
    <div class="field"><label>${t('sv_desc')}</label><textarea class="area" style="min-height:70px" data-svc="desc">${esc(m.desc)}</textarea></div>
    <div class="acts"><button type="button" class="btn secondary" data-act="close-modal">${t('cancel')}</button><button class="btn primary" type="submit">${ic('check')}${t('save')}</button></div></form>`);
}
function submitSvc(){
  const m=UI.svc, e={}, name=m.name.trim();
  if(!name) e.name=t('e_required');
  else if(S.serviceTypes.find(s=>s.id!==m.id&&[s.name,s.name.vi,s.name.en].some(n=>typeof n==='string'&&n.toLowerCase()===name.toLowerCase()))) e.name=t('e_name_dup');
  if(m.km.trim()&&!isInt(m.km,1)) e.km=t('e_positive');
  if(m.months.trim()&&!isInt(m.months,1)) e.months=t('e_positive');
  if(Object.keys(e).length){ m.err=e; renderSvcModal(); return; }
  const data={applies:m.applies,km:m.km.trim()?+m.km:null,months:m.months.trim()?+m.months:null};
  if(m.id){ const s=stype(m.id); Object.assign(s,data); if(name!==stName(s)) s.name=name; if(m.desc.trim()!==stDesc(s)) s.desc=m.desc.trim(); }
  else S.serviceTypes.push({id:nextId(S.serviceTypes),name,desc:m.desc.trim(),active:true,...data});
  closeModal(); toast(t('t_sv_saved')); render();
}

/* ============================ ROUTER & RENDER ============================ */
function parse(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const [name,id]=(path||'').split('/'); return {name:name||'design',id:id?+id:null,q:new URLSearchParams(qs||'')}; }
function go(path){ if(location.hash==='#/'+path) onRoute(true); else location.hash='#/'+path; }
function onRoute(force){
  const r=parse(); if(!SCREENS[r.name]) r.name='dashboard';
  const key=r.name+'/'+(r.id??'')+'?'+r.q;
  if(key!==UI.routeKey||force){ UI.routeKey=key; UI.r=r; UI.open={}; initDraft(r); UI.bell=false; UI.animate=true; window.scrollTo(0,0); }
  render(); UI.animate=false; // chỉ chạy hiệu ứng khi đổi trang, không chạy khi gõ phím hay đổi ngôn ngữ
}
function render(){
  document.documentElement.lang=ui.lang; document.title=(ui.lang==='vi'?'Sổ Bảo Dưỡng Xe':'Vehicle Maintenance Log')+' – UI Design';
  const out=SCREENS[UI.r.name](UI.r);
  const active=document.activeElement, sel=active&&active.dataset&&(active.dataset.d||active.dataset.act||active.dataset.item!=null);
  const keepId=active&&active.matches&&active.matches('input,textarea')?{d:active.dataset.d,act:active.dataset.act,pos:active.selectionStart}:null;
  $('#root').innerHTML=out.full?out.html:shell(out);
  if(keepId){ const el=document.querySelector(keepId.d?`[data-d="${keepId.d}"]`:`[data-act="${keepId.act}"]`); if(el&&el.matches('input,textarea')){ el.focus(); try{ el.setSelectionRange(keepId.pos,keepId.pos); }catch(e){} } }
  renderViewer();
}
function renderViewer(){
  $('#viewer').innerHTML=`<button class="phone-btn" data-act="phone">${ic('phone','18')}<span class="vl">${t('v_phone')}</span></button><button data-go="design" title="Design System">${ic('tag','18')}<span class="vl">Design System</span></button><button data-act="reset" title="${t('v_reset')}">${ic('refresh','18')}<span class="vl">${t('v_reset')}</span></button>`;
  $('#phoneSide').innerHTML=`<b class="t-h2">${t('v_phone_t')}</b><p class="t-small" style="opacity:.8">${t('v_phone_b')}</p><button class="btn" data-act="phone-close">${ic('x')}${t('close')}</button>`;
}
let toastT;
function toast(msg,bad){ const el=$('#toast'); el.className='toast on'+(bad?' bad':''); el.innerHTML=`${ic(bad?'alert':'check-circle','18')}<span>${msg}</span>`; clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2400); }

/* ============================ THEME & LANGUAGE ============================ */
function setTheme(v,silent){ ui.theme=v; document.documentElement.dataset.theme=v; store('vml-theme',v); if(!silent) sync({theme:v}); render(); }
function setLang(v,silent){ ui.lang=v; store('vml-lang',v); if(!silent) sync({lang:v}); render(); }
function sync(msg){ const fr=$('#phoneFrame'); if(fr.contentWindow&&$('#phoneBg').classList.contains('on')) fr.contentWindow.postMessage(msg,'*'); if(window.parent!==window) window.parent.postMessage(msg,'*'); }
window.addEventListener('message',e=>{ if(!e.data) return; if(e.data.theme) setTheme(e.data.theme,true); if(e.data.lang) setLang(e.data.lang,true); });

/* ============================ EVENTS ============================ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  const a=e.target.closest('[data-act]');
  if(a&&!a.disabled){
    const act=a.dataset.act, v=a.dataset.v, id=+a.dataset.id;
    const H={
      theme:()=>setTheme(v), lang:()=>setLang(v),
      bell:()=>{ UI.bell=!UI.bell; render(); },
      tasks:tasksModal, help:helpModal,
      logout:()=>{ UI.loggedIn=false; toast(t('t_logout')); go('login'); },
      vf:()=>{ UI.vf=v; render(); },
      tab:()=>{ UI.tab=v; render(); },
      seg:()=>{ D()[a.dataset.key]=a.dataset.key==='active'?!!v:v; if(a.dataset.key==='mode'){} render(); },
      'add-item':()=>{ D().items.push({typeId:'',desc:'',qty:'1',price:''}); render(); },
      quick:()=>{ const items=D().items, i=items.findIndex(x=>+x.typeId===id);
        if(i>=0){ if(items.length>1) items.splice(i,1); else items[0]={typeId:'',desc:'',qty:'1',price:''}; }
        else { const blank=items.findIndex(x=>!x.typeId&&!x.desc&&!N(x.price)), it={typeId:id,desc:'',qty:'1',price:''}; if(blank>=0) items[blank]=it; else items.push(it); }
        render(); },
      'del-item':()=>{ D().items.splice(+a.dataset.i,1); render(); },
      'ask-archive':()=>{ const x=veh(id); confirmModal({tone:'warn',icon:'archive',title:t('m_archive_t',{name:esc(x.name)}),body:t('m_archive_b'),ok:t('vd_archive'),okClass:'primary',act:'archive-vehicle',id}); },
      'archive-vehicle':()=>{ const x=veh(id); x.archived=true; closeModal(); toast(t('t_archived',{name:esc(x.name)})); render(); },
      'restore-vehicle':()=>{ const x=veh(id); x.archived=false; toast(t('t_restored',{name:esc(x.name)})); render(); },
      'ask-del-vehicle':()=>{ const x=veh(id); confirmModal({tone:'bad',icon:'trash',title:t('m_delveh_t',{name:esc(x.name)}),body:t('m_delveh_b'),ok:t('del_forever'),act:'del-vehicle',id}); },
      'del-vehicle':()=>{ const x=veh(id); S.vehicles=S.vehicles.filter(z=>z.id!==id); S.reminders=S.reminders.filter(z=>z.vehicleId!==id); closeModal(); toast(t('t_veh_deleted',{name:esc(x.name)})); go('vehicles'); },
      'ask-del-record':()=>{ const x=S.records.find(z=>z.id===id), vv=veh(x.vehicleId); confirmModal({tone:'bad',icon:'trash',title:t('m_delrec_t'),body:t('m_delrec_b',{d:fdate(x.date),veh:esc(vv.name),n:x.items.length,total:money(total(x))}),ok:t('del_forever'),act:'del-record',id}); },
      'del-record':()=>{ const x=S.records.find(z=>z.id===id); S.records=S.records.filter(z=>z.id!==id); closeModal(); toast(t('t_record_deleted')); go(`vehicle/${x.vehicleId}`); },
      'ask-del-rem':()=>{ const x=S.reminders.find(z=>z.id===id); confirmModal({tone:'bad',icon:'trash',title:t('m_delrem_t'),body:t('m_delrem_b',{svc:esc(stName(stype(x.typeId))),veh:esc(veh(x.vehicleId).name)}),ok:t('del'),act:'del-rem',id}); },
      'del-rem':()=>{ const x=S.reminders.find(z=>z.id===id); S.reminders=S.reminders.filter(z=>z.id!==id); closeModal(); toast(t('t_rem_deleted')); go(`vehicle/${x.vehicleId}?tab=rem`); },
      'close-modal':closeModal,
      'stats-range':()=>{ UI.statsRange=v; render(); },
      csv:()=>toast(t('t_csv')),
      'svc-filter':()=>{ UI.svcFilter=v; render(); },
      'svc-modal':()=>svcModal(id||null),
      'svc-applies':()=>{ UI.svc.applies=v; renderSvcModal(); },
      'svc-toggle':()=>{ const s=stype(id); s.active=!s.active; toast(t(s.active?'t_sv_on':'t_sv_off',{name:esc(stName(s))})); render(); },
      'ask-del-svc':()=>{ const s=stype(id); confirmModal({tone:'bad',icon:'trash',title:t('m_delsv_t',{name:esc(stName(s))}),body:t('m_delsv_b'),ok:t('del'),act:'del-svc',id}); },
      'del-svc':()=>{ const s=stype(id); S.serviceTypes=S.serviceTypes.filter(z=>z.id!==id); closeModal(); toast(t('t_sv_deleted',{name:esc(stName(s))})); render(); },
      'ai-ex':()=>{ UI.ai.text=v; UI.ai.err=null; render(); },
      'ai-force':()=>{ UI.ai.force=v; render(); },
      'ai-run':runAi,
      'ai-make-rem':()=>{ const d=UI.ai.result; const exists=S.reminders.find(x=>x.vehicleId===d.vehicleId&&x.typeId===d.typeId); go(exists?`reminder-edit/${exists.id}`:`reminder-new/${d.vehicleId}?type=${d.typeId}`); },
      'hist-filter':()=>{ UI.histFilter=v; render(); },
      'hist-detail':()=>{ const d=S.diagnoses.find(z=>z.id===id); openModal(`<div class="row"><b class="t-h2 grow">${t('h_detail')}</b><button class="icon-btn plain" data-act="close-modal" aria-label="${t('close')}">${ic('x')}</button></div><div class="box2"><div class="t-caption muted">${ftime(d.at)} · ${d.vehicleId&&veh(d.vehicleId)?esc(veh(d.vehicleId).name):'—'}</div><p>${esc(d.symptom)}</p></div>${d.status==='OK'?`<div class="row"><span class="badge b-${{LOW:'ok',MEDIUM:'warn',HIGH:'bad'}[d.urgency]}">${t('ug_'+d.urgency)}</span><span class="badge b-info nodot">${esc(stName(stype(d.typeId)))}</span></div><p>${esc(d.suggestion[ui.lang])}</p>`:`<div class="alert bad">${ic('alert','18')}<div><b>${t('err_'+d.error)}</b><p>${t('errd_'+d.error)}</p></div></div>`}<div class="acts"><button class="btn secondary" data-act="close-modal">${t('close')}</button></div>`); },
      'pw-eye':()=>{ UI.showPw=!UI.showPw; render(); },
      forgot:()=>toast(t('t_forgot')),
      'demo-login':()=>{ UI.loggedIn=true; UI.user={name:'Bảo Giang',email:'giang@example.com'}; toast(t('t_welcome',{name:'Bảo Giang'})); go('dashboard'); },
      phone:()=>{ const fr=$('#phoneFrame'); fr.src=location.href.split('#')[0].split('?')[0]+`?embed=1&theme=${ui.theme}&lang=${ui.lang}`+(location.hash||'#/dashboard').replace('#/design','#/dashboard'); $('#phoneBg').classList.add('on'); },
      'phone-close':()=>$('#phoneBg').classList.remove('on'),
      reset:()=>{ S=structuredClone(SEED); UI.ai.result=null; UI.ai.state='idle'; toast(t('t_reset')); onRoute(true); },
      'ds-switch':()=>a.classList.toggle('on'),
      'ds-toast':()=>toast(t('t_record_saved')),
      'ds-modal':()=>confirmModal({tone:'bad',icon:'trash',title:t('m_delrec_t'),body:t('m_delrec_b',{d:fdate('2026-02-18'),veh:'Vios gia đình',n:4,total:money(1960000)}),ok:t('del_forever'),act:'close-modal',id:0}),
    };
    if(H[act]){ e.preventDefault(); H[act](); return; }
  }
  if(g&&!g.disabled){ e.preventDefault(); if(g.dataset.tab) UI.tab=g.dataset.tab; const path=g.dataset.go+(g.dataset.tab&&!g.dataset.go.includes('?')?`?tab=${g.dataset.tab}`:''); closeModal(); go(path); return; }
  if(UI.bell&&!e.target.closest('.pop')){ UI.bell=false; render(); }
});
// <details> toggle does not bubble: listen in the capture phase. Guard avoids a render loop when render() re-creates an open <details>.
document.addEventListener('toggle',e=>{ const d=e.target; if(!d.dataset||!d.dataset.disc) return; const n=d.dataset.disc; if(!!UI.open[n]===d.open) return; UI.open[n]=d.open; if(n==='rec') render(); },true);
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
$('#phoneBg').addEventListener('click',e=>{ if(e.target.id==='phoneBg') $('#phoneBg').classList.remove('on'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('#phoneBg').classList.remove('on'); if(UI.bell){ UI.bell=false; render(); } } });

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.d!=null){ D()[el.dataset.d]=el.type==='checkbox'?el.checked:el.value; liveUpdate(el.dataset.d); return; }
  if(el.dataset.item!=null){ D().items[+el.dataset.item][el.dataset.f]=el.value; recalcRecord(); return; }
  if(el.dataset.svc){ UI.svc[el.dataset.svc]=el.value; return; }
  const act=el.dataset.act;
  if(act==='ai-text'){ UI.ai.text=el.value; $('#aiCount').textContent=el.value.length+'/1000'; if(UI.ai.err&&el.value.trim().length>=10){ UI.ai.err=null; el.classList.remove('error'); $('#aiHelp').textContent=t('ai_len'); $('#aiHelp').classList.remove('err'); } }
  if(act==='search-local'){ UI.q=el.value; render(); }
});
document.addEventListener('change',e=>{
  const el=e.target, act=el.dataset.act;
  if(el.dataset.rerender){ D()[el.dataset.d]=el.value; if(UI.r.name.startsWith('reminder')&&el.dataset.d==='typeId'){ const st=stype(el.value); if(st){ D().km=st.km?String(st.km):''; D().months=st.months?String(st.months):''; D().mode=st.km&&st.months?'both':st.km?'km':'mo'; } } if(UI.r.name.startsWith('record')&&el.dataset.d==='vehicleId'){ const v=veh(el.value); D().odo=String(v.odo); } render(); }
  if(el.dataset.item!=null&&el.dataset.f==='typeId'){ render(); }
  if(act==='stats-veh'){ UI.statsVeh=el.value; render(); }
  if(act==='ai-veh'){ UI.ai.vehicleId=el.value; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset.act==='search'){ UI.q=e.target.value; UI.vf='all'; go('vehicles'); } });
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  ({vehicle:submitVehicle,record:submitRecord,reminder:submitReminder,login:submitLogin,register:submitRegister,svc:submitSvc})[f]();
});
function liveUpdate(key){
  const n=UI.r.name, d=D();
  if(n.startsWith('vehicle-')){ const p=$('#vfPrevName'); if(p){ p.textContent=d.name||'—'; $('#vfPrevSub').textContent=[d.brand,d.model].filter(Boolean).join(' ')+(d.year?' · '+d.year:''); $('#vfPrevPlate').textContent=d.plate||'—'; } }
  if(n.startsWith('reminder')){ const p=$('#remPrev'); if(p) p.innerHTML=previewRem(); }
  if(n==='register'&&key==='password'){ const s=pwScore(d.password); $('#pwBar').className='strength s'+s; $('#pwTxt').textContent=t('pw_strength',{s:t('pw_'+s)}); $('#pwTxt').classList.remove('err'); }
}
function recalcRecord(){
  const d=D(); let tot=0;
  d.items.forEach((it,i)=>{ const v=N(it.qty)*N(it.price); tot+=v; const el=document.querySelector(`[data-line="${i}"]`); if(el) el.textContent=money(v); });
  $('#sumSub').textContent=money(tot); $('#sumTotal').textContent=money(tot);
}
function runAi(){
  const a=UI.ai, len=a.text.trim().length;
  if(len<10){ a.err=t('e_short'); render(); return; }
  if(len>1000){ a.err=t('e_long'); render(); return; }
  a.err=null; a.state='loading'; render();
  setTimeout(()=>{
    const base={id:nextId(S.diagnoses),vehicleId:a.vehicleId?+a.vehicleId:null,symptom:a.text.trim(),model:'gemini-flash',at:TODAY_ISO+'T'+new Date().toTimeString().slice(0,5)};
    const d=a.force==='OK'?{...base,status:'OK',error:null,...mockAi(a.text)}:{...base,status:'FAILED',error:a.force,urgency:null,typeId:null,suggestion:null};
    S.diagnoses.push(d); a.result=d; a.state='done';
    if(UI.r.name==='ai') render();
  },1200);
}

const P=new URLSearchParams(location.search);
if(P.has('embed')) document.body.classList.add('embed');
ui.theme=P.get('theme')||store('vml-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
ui.lang=P.get('lang')||store('vml-lang')||'vi';
document.documentElement.dataset.theme=ui.theme;
window.addEventListener('hashchange',()=>onRoute());
onRoute();
